<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For My Favourite Person 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #fff4c7, #e8ddff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #5b4050;
    }

    /* Floating emojis */
    .emoji {
      position: fixed;
      bottom: -50px;
      font-size: 25px;
      animation: float 7s linear infinite;
      opacity: 0.8;
      z-index: 0;
    }

    .emoji:nth-child(1) { left: 5%; animation-delay: 0s; }
    .emoji:nth-child(2) { left: 20%; animation-delay: 2s; }
    .emoji:nth-child(3) { left: 40%; animation-delay: 4s; }
    .emoji:nth-child(4) { left: 60%; animation-delay: 1s; }
    .emoji:nth-child(5) { left: 80%; animation-delay: 3s; }
    .emoji:nth-child(6) { left: 92%; animation-delay: 5s; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(120, 80, 100, 0.2);
      position: relative;
      z-index: 2;
